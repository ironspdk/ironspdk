name: lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
      - dev
  push:
    branches:
      - master
      - dev

jobs:
  lint:

    runs-on: ubuntu-24.04

    steps:

      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            libclang-dev \

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: make lint
        run: |
          make lint
